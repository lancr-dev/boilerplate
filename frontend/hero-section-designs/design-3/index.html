<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bento Hero Section</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero-container">
        <!-- LEFT CONTENT -->
        <div class="hero-content">
          <span class="hero-badge"> Modern UI Template </span>

          <h1>Build Beautiful Modern Websites Today</h1>

          <p>
            A responsive bento-style hero section template perfect for SaaS,
            startups, agencies, portfolios, and landing pages.
          </p>

          <div class="hero-buttons">
            <a href="#" class="btn btn-primary"> Get Started </a>

            <a href="#" class="btn btn-secondary"> Learn More </a>
          </div>
        </div>

        <!-- RIGHT BENTO GRID -->
        <div class="hero-grid">
          <div class="grid-box large">
            <div class="placeholder-image">Large Image</div>
          </div>

          <div class="grid-box">
            <div class="placeholder-image">Image</div>
          </div>

          <div class="grid-box">
            <div class="placeholder-image">Image</div>
          </div>

          <div class="grid-box wide">
            <div class="placeholder-image">Wide Image</div>
          </div>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
