<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Navbar</title>
  </head>
  <body>
    <nav class="nav-bar">
      <p class="logo">Your<span>Logo</span></p>
      <div class="side-bar">
        <button class="close-side-bar" onclick="closeSideBar()">
          <svg
            width="25px"
            height="25px"
            xmlns="http://www.w3.org/2000/svg"
            width="200"
            height="200"
            viewBox="0 0 20 20"
          >
            <path
              fill="#a200ff"
              d="M10 8.586L2.929 1.515L1.515 2.929L8.586 10l-7.071 7.071l1.414 1.414L10 11.414l7.071 7.071l1.414-1.414L11.414 10l7.071-7.071l-1.414-1.414L10 8.586z"
            />
          </svg>
        </button>
        <a href="#">Features</a>
        <a href="#">Solutions</a>
        <a href="#">Resources</a>
        <a href="#">Pricing</a>
        <a href="#">FAQ</a>
      </div>
      <div class="nav-links">
        <a href="#" class="hide-on-mobile">Features</a>
        <a href="#" class="hide-on-mobile">Solutions</a>
        <a href="#" class="hide-on-mobile">Resources</a>
        <a href="#" class="hide-on-mobile">Pricing</a>
        <a href="#" class="hide-on-mobile">FAQ</a>
      </div>
      <div class="nav-btns">
        <button class="sign-in-btn">Sign In</button>
        <button class="get-started-btn">Get Started</button>
        <button class="side-bar-btn" onclick="openSideBar()">
          <svg
            width="25px"
            height="25px"
            xmlns="http://www.w3.org/2000/svg"
            width="200"
            height="200"
            viewBox="0 0 16 16"
          >
            <path
              fill="#a200ff"
              fill-rule="evenodd"
              d="M0 3.75A.75.75 0 0 1 .75 3h14.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 3.75ZM0 8a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 8Zm.75 3.5a.75.75 0 0 0 0 1.5h14.5a.75.75 0 0 0 0-1.5H.75Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
